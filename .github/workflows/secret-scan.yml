# Secret-scanning backstop. The pre-commit guard (gitleaks-guard) is local-only
# and skippable with --no-verify; this workflow is the gate that always runs.
name: secret-scan
on:
  push:
  pull_request:
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — scan every commit, not just HEAD
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan full git history
        run: /tmp/gitleaks git --redact --no-banner --verbose .
