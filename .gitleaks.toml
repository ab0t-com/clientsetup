# Gitleaks configuration for clientsetup
# https://github.com/gitleaks/gitleaks
#
# Policy: scan EVERY file (including .md docs and .json.example) with the full
# default ruleset, but allow obvious documentation *placeholders* so doc files
# that illustrate the shape of a secret don't trip the scanner.
#
# Real secrets in any file (docs included) WILL be flagged.

title = "clientsetup gitleaks config"

[extend]
  # Use the full built-in gitleaks ruleset as the base.
  useDefault = true

[allowlist]
  description = "Allow documentation placeholders only — never whole files"
  # Match these patterns against the detected secret/match, not the file path.
  regexTarget = "match"
  regexes = [
    # x-string placeholders, e.g. ab0t_sk_live_xxxxxxxx
    '''(?i)x{4,}''',
    # literal REDACTED placeholder
    '''(?i)redacted''',
    # ellipsis placeholders, e.g. ab0t_sk_live_...
    '''\.\.\.''',
    # uuid-shaped placeholders, e.g. xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    '''(?i)x{8}-x{4}-x{4}-x{4}-x{12}''',
    # angle-bracket / curly placeholders, e.g. <your-key>, {PROVIDER}_KEY
    '''<[^>]+>''',
    '''\{[A-Z0-9_]+\}''',
  ]

# ── Guard: service-admin password DERIVED from a public identifier ───────────────
# Never ship a credential computed from a public identifier (e.g. a service name plus a fixed
# suffix such as <Name>Admin<year>!Secure). Any occurrence of such a pattern (script, doc,
# example) is a finding; generate a random password and save it to the
# 0600 credentials file instead. Matches only the fixed suffix, so a placeholder allowlist
# (<...>, {VAR}) can never hide a templated derivation.
[[rules]]
id = "ab0t-derived-service-admin-password"
description = "Service-admin password derived from the service name (<Name>Admin20NN!Secure) is guessable"
regex = '''(?i)admin20[0-9]{2}!secure'''
keywords = ["admin20"]
